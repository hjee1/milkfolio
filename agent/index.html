<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>M</text></svg>"/>
<style>
  :root {
    --bg: #080808;
    --card: #111318;
    --border: #1e2028;
    --text: #e1e4ed;
    --dim: #666;
    --soft: #8b8fa3;
    --accent: #b8a98a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  body.gate-view {
    display: flex; align-items: center; justify-content: center;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap');

  /* ── Login Gate ── */
  #gate {
    text-align: center; padding: 48px;
  }
  #gate h1 {
    font-size: 0.9rem; font-weight: 300; letter-spacing: 4px;
    text-transform: uppercase; color: var(--dim); margin-bottom: 32px;
  }
  #gate input {
    background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 12px 20px; font-size: 0.9rem;
    border-radius: 0; width: 240px; text-align: center;
    font-family: inherit; letter-spacing: 2px;
    outline: none; transition: border-color 0.3s;
  }
  #gate input:focus { border-color: var(--accent); }
  #gate input::placeholder { color: #333; }
  #gate .error {
    color: #8b4040; font-size: 0.75rem; margin-top: 12px;
    opacity: 0; transition: opacity 0.3s;
  }
  #gate .error.show { opacity: 1; }

  /* ── Dashboard ── */
  #dashboard { display: none; }
  #dashboard.visible { display: block; }

  /* ── Top Nav (sticky tabs) ── */
  /* Replaces the old free-floating layout: section-routed tabs at top so the
     user can jump between 기간별 / 지원내역 / 출처별 / 중복 instantly.
     Active tab is computed by IntersectionObserver — whichever section is
     currently in view gets the gold underline. */
  .topnav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(8, 8, 8, 0.88);
    backdrop-filter: saturate(160%) blur(10px);
    -webkit-backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topnav-inner {
    max-width: 1200px; margin: 0 auto;
    padding: 12px 24px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 24px;
  }
  .nav-brand {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .nav-tabs {
    display: flex;
    gap: 4px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .nav-tabs a {
    padding: 8px 14px;
    font-size: 0.82rem;
    color: var(--soft);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.2s ease, border-color 0.2s ease;
    white-space: nowrap;
  }
  .nav-tabs a:hover { color: var(--text); }
  .nav-tabs a.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .nav-stats {
    display: flex;
    gap: 18px;
    font-size: 0.74rem;
    color: var(--dim);
    letter-spacing: 0.04em;
  }
  .nav-stats em {
    font-style: normal;
    font-weight: 600;
    color: var(--text);
    margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }
  .nav-stats .nav-stat {
    display: inline-flex; align-items: center; gap: 4px;
  }
  .nav-actions { display: flex; gap: 6px; }
  .nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--soft);
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn svg { width: 13px; height: 13px; }

  @media (max-width: 768px) {
    .topnav-inner { grid-template-columns: 1fr; gap: 8px; padding: 10px 16px; }
    .nav-brand { text-align: center; }
    .nav-stats { display: none; }
    .nav-actions { justify-content: center; }
  }

  /* ── Section layout ── */
  /* Sections are stacked top-to-bottom in the user-defined order:
     period (top) → apps (MAIN) → source → anomaly (bottom).
     KPI cards and API cost slots are hidden via the slot rules below. */
  .section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 36px 24px;
    scroll-margin-top: 64px; /* offset for sticky topnav when anchor-jumping */
  }
  .section + .section { border-top: 1px solid var(--border); }
  .section-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .section-head h2 {
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text);
    margin: 0;
  }
  .section-head .sec-meta {
    font-size: 0.74rem;
    color: var(--dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* MAIN section (지원 내역) — visually weighted heavier */
  .section.main {
    padding: 44px 24px 56px;
    background:
      radial-gradient(800px 200px at 50% 0%, rgba(184,169,138,0.04), transparent 70%);
  }
  .section.main .section-head h2 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .section.main .section-head h2::before {
    content: '';
    display: inline-block;
    width: 4px; height: 18px;
    background: var(--accent);
    margin-right: 12px;
    vertical-align: -2px;
    border-radius: 2px;
  }

  /* ── Sub-toolbar (search + filters) ─ inside the apps section, sticky ── */
  /* Stays glued under the topnav when scrolling the long apps table so the
     search/filter controls stay reachable instead of being buried below. */
  .sub-toolbar {
    position: sticky;
    top: 56px;
    z-index: 40;
    background: rgba(8, 8, 8, 0.92);
    backdrop-filter: saturate(160%) blur(10px);
    -webkit-backdrop-filter: saturate(160%) blur(10px);
    margin: 0 -24px 18px;
    padding: 12px 24px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .toolbar-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto auto;
    gap: 8px;
    align-items: center;
  }
  #search-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--dim); }

  .sub-toolbar select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    font-size: 0.84rem;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    min-height: 38px;
    transition: border-color 0.2s ease;
  }
  .sub-toolbar select:focus { border-color: var(--accent); }
  .sub-toolbar button#filter-reset {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--soft);
    padding: 9px 14px;
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 1px;
    min-height: 38px;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .sub-toolbar button#filter-reset:hover {
    border-color: var(--accent); color: var(--text);
  }
  .result-line {
    margin-top: 10px;
    font-size: 0.74rem;
    color: var(--dim);
    letter-spacing: 0.04em;
  }
  .result-line strong { color: var(--accent); font-weight: 600; }

  #search-empty {
    display: none;
    margin: 18px 0;
    padding: 24px;
    text-align: center;
    color: var(--dim);
    font-size: 0.86rem;
    border: 1px dashed var(--border);
  }
  #search-empty.show { display: block; }

  @media (max-width: 768px) {
    .sub-toolbar { top: 102px; /* taller stacked topnav on mobile */ }
    .toolbar-row {
      grid-template-columns: 1fr 1fr;
    }
    .toolbar-row #search-input { grid-column: span 2; }
    .toolbar-row button#filter-reset { grid-column: span 2; }
    #search-input { font-size: 16px; } /* avoid iOS zoom */
    .sub-toolbar select { font-size: 16px; }
  }

  /* ── data.html slot management ──────────────────────────────────
     data.html is auto-pushed by the casting-agent pipeline. We can't edit
     it, so we load it into a hidden host and the JS extracts its sections
     into the named slots below in the order the user wants:
       1. slot-period  ← 기간별 리포트
       2. slot-apps    ← 지원 내역 (MAIN)
       3. slot-source  ← 출처별 현황
       4. slot-anomaly ← 중복 발송 감지
     KPI cards (.cards) and API cost section get dropped entirely.
  ── */
  #dashboard-frame { display: none; } /* hidden parse host */

  .slot :where(.cards, h1, .subtitle) { display: none; } /* belt-and-suspenders */

  /* Bring back the data.html's original visual language inside slots so the
     pipeline-supplied tables/charts/badges still render correctly. These are
     copies of the styles data.html ships, scoped under .slot so they only
     apply to the extracted content. */
  .slot h2 {
    font-size: 1.05rem; font-weight: 500;
    letter-spacing: 0.04em; margin: 0 0 16px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  /* hide the duplicate h2 inside slots since each section has its own head */
  .slot > h2:first-child { display: none; }

  .slot table {
    width: 100%; border-collapse: collapse;
    font-size: 0.82rem;
    background: var(--card); border-radius: 8px;
    overflow: hidden; border: 1px solid var(--border);
  }
  .slot th {
    background: #1a1d27;
    text-align: left; padding: 10px 12px;
    color: var(--soft); font-weight: 500;
    font-size: 0.74rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .slot td {
    padding: 9px 12px;
    border-top: 1px solid var(--border);
    color: var(--text);
  }
  .slot tr:hover td { background: #1a1d27; }

  .slot .badge {
    display: inline-block; padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
  }
  .slot .badge.sent     { background: #064e3b; color: #4ade80; }
  .slot .badge[class*="failed"] { background: #7f1d1d; color: #f87171; }
  .slot .badge[class*="skipped"] { background: #78350f; color: #fbbf24; }
  .slot .badge.dup { background: #7f1d1d; color: #fb923c; }
  .slot .badge.sent_dbfail { background: #7f1d1d; color: #fb923c; }

  .slot .tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .slot .tab {
    padding: 7px 16px;
    background: transparent;
    color: var(--soft);
    cursor: pointer; font-size: 0.8rem;
    border: 1px solid var(--border);
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .slot .tab:hover { color: var(--text); }
  .slot .tab.active {
    background: var(--accent); color: #1a1410;
    border-color: var(--accent);
  }

  .slot .section { /* note: data.html uses .section internally for tab content;
                     our .section class above is for our top-level wrappers.
                     The :where() / specificity here matches data.html's usage. */
    display: none; max-width: none; padding: 0; margin: 0;
  }
  .slot .section.active { display: block; }
  .slot .section + .section { border-top: none; }

  .slot .pager {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-top: 14px;
    font-size: 0.76rem; color: var(--dim);
  }
  .slot .pager-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 14px; cursor: pointer;
    font-size: 0.76rem; font-family: inherit;
    transition: border-color 0.2s ease;
  }
  .slot .pager-btn:hover:not(:disabled) { border-color: var(--accent); }
  .slot .pager-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .slot .chart-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 0.82rem;
  }
  .slot .chart-bar .bar-label {
    width: 130px; flex-shrink: 0;
    color: var(--text); font-weight: 500;
  }
  .slot .chart-bar .bar-track {
    flex: 1; height: 6px;
    background: var(--border);
    border-radius: 4px; overflow: hidden;
  }
  .slot .chart-bar .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #5a5240, var(--accent));
    color: transparent; font-size: 0;
    transition: width 0.6s ease;
  }
  .slot .chart-bar > div:last-child {
    color: var(--dim) !important;
    font-size: 0.74rem !important;
    min-width: 160px !important;
    text-align: right;
  }

  .slot .alert {
    background: #2a1a05; border: 1px solid #92400e;
    border-radius: 8px; padding: 16px;
  }
  .slot .alert h3 { color: #fb923c; font-size: 0.9rem; margin-bottom: 8px; }
  .slot .alert p { font-size: 0.84rem; color: #fbbf24; }

  #no-data {
    text-align: center; padding: 80px 24px; color: var(--dim);
    font-size: 0.85rem;
  }

  /* ── Cost colophon (Option B from SPEC-USAGE-001 follow-up) ──────
     A single tiny line at the very bottom of the page showing actual
     monthly + cumulative OpenAI cost. Data extracted by JS from data.html's
     "API 사용량 (실측)" or "API 비용 (추정)" section (whichever is present).
     The full cost section itself is still dropped from the main flow per
     the user's earlier preference — this is the minimal footprint version.
  ── */
  .page-footer {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 40px;
    text-align: center;
    font-size: 0.74rem;
    color: var(--dim);
    letter-spacing: 0.04em;
    border-top: 1px solid var(--border);
    margin-top: 12px;
  }
  .page-footer .cost-line {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .page-footer .amt {
    color: var(--soft);
    font-variant-numeric: tabular-nums;
  }
  .page-footer .amt strong {
    color: var(--text);
    font-weight: 600;
    margin-left: 4px;
  }
  .page-footer .sep {
    color: var(--border);
  }
  .page-footer .tag {
    display: inline-block;
    padding: 1px 7px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 0.66rem;
    color: var(--soft);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .page-footer .tag.actual {
    color: var(--accent);
    border-color: var(--accent);
  }
  .page-footer[hidden] { display: none; }
  @media (max-width: 600px) {
    .page-footer { padding: 20px 16px 32px; font-size: 0.7rem; }
  }

  /* MAIN section makes the table look like the page's centerpiece */
  .section.main #slot-apps table {
    font-size: 0.86rem;
  }
  .section.main #slot-apps td {
    padding: 11px 14px;
  }
  .section.main #slot-apps th {
    padding: 12px 14px;
  }
</style>
</head>
<body class="gate-view">

<div id="gate">
  <h1>casting agent</h1>
  <input type="password" id="pw" placeholder="password" autofocus>
  <div class="error" id="err">incorrect</div>
</div>

<div id="dashboard">

  <!-- ─── Sticky top navigation ─────────────────────────────── -->
  <nav class="topnav" aria-label="섹션 네비게이션">
    <div class="topnav-inner">
      <div class="nav-brand">Casting Agent</div>
      <div class="nav-tabs" id="nav-tabs">
        <a href="#sec-period"  data-tab="period">기간별 리포트</a>
        <a href="#sec-apps"    data-tab="apps" class="active">지원 내역</a>
        <a href="#sec-source"  data-tab="source">출처별</a>
        <a href="#sec-anomaly" data-tab="anomaly">중복 감지</a>
      </div>
      <div class="nav-stats">
        <span class="nav-stat">수집<em id="stat-collected">—</em></span>
        <span class="nav-stat">발송<em id="stat-sent">—</em></span>
        <span class="nav-actions">
          <button type="button" class="nav-btn" id="btn-refresh" title="새로고침" aria-label="새로고침">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
        </span>
      </div>
    </div>
  </nav>

  <!-- ─── 1. 기간별 리포트 (top) ─────────────────────────────── -->
  <section class="section" id="sec-period">
    <div class="section-head">
      <h2>기간별 리포트</h2>
      <span class="sec-meta">일 · 주 · 월</span>
    </div>
    <div class="slot" id="slot-period">
      <div id="no-data">waiting for first pipeline run...</div>
    </div>
  </section>

  <!-- ─── 2. 지원 내역 (MAIN — centerpiece) ──────────────────── -->
  <section class="section main" id="sec-apps">
    <div class="section-head">
      <h2>지원 내역</h2>
      <span class="sec-meta" id="apps-meta">대시보드 메인</span>
    </div>

    <!-- Sticky sub-toolbar: search + filter + sort + reset, glued under topnav -->
    <div class="sub-toolbar">
      <div class="toolbar-row">
        <input type="text" id="search-input" placeholder="검색 (제목 · 감독 · 제작사 · 역할 · 수신 이메일)" autocomplete="off" spellcheck="false">
        <select id="filter-period" aria-label="기간">
          <option value="all">전체 기간</option>
          <option value="today">오늘</option>
          <option value="week">이번 주</option>
          <option value="month">이번 달</option>
        </select>
        <select id="filter-status" aria-label="상태">
          <option value="all">전체 상태</option>
          <option value="sent">발송</option>
          <option value="failed">실패</option>
          <option value="skipped">건너뜀</option>
        </select>
        <select id="filter-sort" aria-label="정렬">
          <option value="recent">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="title">제목 ABC</option>
        </select>
        <button type="button" id="filter-reset">초기화</button>
      </div>
      <div class="result-line" id="result-line"></div>
    </div>

    <div id="search-empty">검색 결과 없음</div>
    <div class="slot" id="slot-apps"></div>
  </section>

  <!-- ─── 3. 출처별 현황 ─────────────────────────────────────── -->
  <section class="section" id="sec-source">
    <div class="section-head">
      <h2>출처별 현황</h2>
      <span class="sec-meta">소스별 수집 · 매칭 · 발송</span>
    </div>
    <div class="slot" id="slot-source"></div>
  </section>

  <!-- ─── 4. 중복 발송 감지 (bottom) ─────────────────────────── -->
  <section class="section" id="sec-anomaly">
    <div class="section-head">
      <h2>중복 발송 감지</h2>
      <span class="sec-meta">이상 탐지</span>
    </div>
    <div class="slot" id="slot-anomaly"></div>
  </section>

  <!-- Hidden host: data.html innerHTML lands here for parsing -->
  <div id="dashboard-frame"></div>

  <!-- Minimal cost colophon (SPEC-USAGE-001 follow-up, Option B) -->
  <footer class="page-footer" id="cost-footer" hidden>
    <span class="cost-line" id="cost-line"></span>
  </footer>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// Password gate (sha-256, session-scoped)
// ════════════════════════════════════════════════════════════════
const HASH = '3324dab86f4dcdf48ba8ed6d736dcf050f09a23bf617c7d3579224548269ba1f';

const gate = document.getElementById('gate');
const dashboard = document.getElementById('dashboard');
const pw = document.getElementById('pw');
const err = document.getElementById('err');

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function enterDashboard() {
  gate.style.display = 'none';
  document.body.classList.remove('gate-view');
  dashboard.classList.add('visible');
  loadDashboard();
}

if (sessionStorage.getItem('agent_auth') === 'true') enterDashboard();

pw.addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  err.classList.remove('show');
  const hash = await sha256(pw.value);
  if (hash === HASH) {
    sessionStorage.setItem('agent_auth', 'true');
    enterDashboard();
  } else {
    err.classList.add('show');
    pw.value = '';
  }
});

// Topnav refresh button
const btnRefresh = document.getElementById('btn-refresh');
if (btnRefresh) btnRefresh.addEventListener('click', () => {

// Active-tab indicator via IntersectionObserver: whichever section is
// currently in view gets the gold underline. Falls back gracefully if the
// browser lacks IO support.
function setupSectionObserver() {
  if (!('IntersectionObserver' in window)) return;
  const tabs = document.querySelectorAll('.nav-tabs a');
  const tabMap = {};
  tabs.forEach(t => { tabMap[t.dataset.tab] = t; });
  const sectionMap = {
    'sec-period': 'period',
    'sec-apps': 'apps',
    'sec-source': 'source',
    'sec-anomaly': 'anomaly'
  };
  const io = new IntersectionObserver((entries) => {
    // Find the section with the largest intersection ratio.
    let best = null;
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      if (!best || e.intersectionRatio > best.intersectionRatio) best = e;
    });
    if (best) {
      const key = sectionMap[best.target.id];
      if (key) {
        tabs.forEach(t => t.classList.remove('active'));
        if (tabMap[key]) tabMap[key].classList.add('active');
      }
    }
  }, { rootMargin: '-80px 0px -50% 0px', threshold: [0.1, 0.3, 0.5] });
  Object.keys(sectionMap).forEach(id => {
    const el = document.getElementById(id);
    if (el) io.observe(el);
  });
}
setupSectionObserver();

// Dashboard loader — fetch data.html, redistribute into slots
// ════════════════════════════════════════════════════════════════
function loadDashboard() {
  fetch('data.html?v=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('no data'); return r.text(); })
    .then(html => {
      const host = document.getElementById('dashboard-frame');
      host.innerHTML = html;
      redistribute(host);
      runInjectedScripts(host);
      // Re-apply current filter state so search survives a pipeline refresh.
      if (typeof window.applyAllFilters === 'function') window.applyAllFilters();
    })
    .catch(() => { /* data.html not pushed yet — placeholder stays */ });
}

// Move data.html's auto-generated sections into our user-ordered slots.
// Strategy: walk the host's children top-to-bottom; each <h2> begins a new
// section; collect everything up to the next <h2>. Route by h2 text.
function redistribute(host) {
  // First, pull mini KPI stats (cards) before discarding them.
  const cards = host.querySelectorAll('.cards .card');
  cards.forEach(c => {
    const label = (c.querySelector('.label')?.textContent || '').trim();
    const num = (c.querySelector('.num')?.textContent || '').trim();
    if (/총\s*수집|수집/.test(label)) setStat('stat-collected', num);
    else if (/발송 성공|발송$/.test(label)) setStat('stat-sent', num);
  });

  // Group children into [h2 + following non-h2 nodes] buckets.
  const buckets = [];
  let current = null;
  Array.from(host.children).forEach(node => {
    if (node.tagName === 'H2') {
      if (current) buckets.push(current);
      current = { heading: node, nodes: [] };
    } else if (current) {
      current.nodes.push(node);
    }
    // Pre-h2 nodes (h1, .subtitle, .cards) are intentionally orphaned — we don't show them.
  });
  if (current) buckets.push(current);

  // Route by heading text. Unknown sections (e.g. "API 비용") are dropped.
  const slots = {
    period:   document.getElementById('slot-period'),
    apps:    document.getElementById('slot-apps'),
    source:  document.getElementById('slot-source'),
    anomaly: document.getElementById('slot-anomaly')
  };
  // Clear previous content before re-injecting (refresh case).
  Object.values(slots).forEach(s => { if (s) s.innerHTML = ''; });

  // Collect the API cost/usage bucket separately for the footer colophon
  // (we still drop it from the main flow per the user's preference — Option B).
  let costBucket = null;

  buckets.forEach(b => {
    const txt = (b.heading.textContent || '').trim();
    let slot = null;
    if (/기간별 리포트/.test(txt))      slot = slots.period;
    else if (/지원 내역/.test(txt))      slot = slots.apps;
    else if (/출처별/.test(txt))         slot = slots.source;
    else if (/중복/.test(txt))           slot = slots.anomaly;
    else if (/API\s*(사용량|비용)/.test(txt)) { costBucket = b; return; }
    else return; // anything else dropped silently
    if (!slot) return;
    // Re-insert the h2 too (CSS hides the first h2 inside each slot to avoid
    // duplicate headings — our own section-head h2 above takes precedence).
    slot.appendChild(b.heading);
    b.nodes.forEach(n => slot.appendChild(n));
  });

  // If anomaly slot is empty, hide that section so we don't show an empty bottom block.
  const anomalySec = document.getElementById('sec-anomaly');
  if (anomalySec) {
    anomalySec.style.display = slots.anomaly && slots.anomaly.querySelector('.alert') ? '' : 'none';
  }

  // Update apps section meta with row count.
  const appsRows = slots.apps ? slots.apps.querySelectorAll('#tbl-apps tbody tr').length : 0;
  const meta = document.getElementById('apps-meta');
  if (meta) meta.textContent = appsRows ? '총 ' + appsRows + '건' : '대시보드 메인';

  // Render the cost colophon (footer) from whatever cost section data.html emits.
  renderCostFooter(costBucket);
}

// SPEC-USAGE-001 Option B — render a single tiny line at page bottom from
// data.html's API cost/usage section. Looks for cost-items labelled with
// "월 ..." (monthly projection) and "총 ..." (cumulative). Tags it [실측]
// when the heading says "(실측)", otherwise [추정]. Hides the footer when no
// cost section is present (older data.html or empty pipeline state).
function renderCostFooter(bucket) {
  const footer = document.getElementById('cost-footer');
  const line = document.getElementById('cost-line');
  if (!footer || !line) return;
  if (!bucket) { footer.hidden = true; return; }

  // Collect every .cost-item from the bucket's nodes.
  const items = [];
  bucket.nodes.forEach(n => {
    if (!n || !n.querySelectorAll) return;
    n.querySelectorAll('.cost-item').forEach(it => {
      const label = (it.querySelector('.cost-label')?.textContent || '').trim();
      const val   = (it.querySelector('.cost-val')?.textContent   || '').trim();
      if (label && val) items.push({ label, val });
    });
  });
  if (!items.length) { footer.hidden = true; return; }

  // Heuristic label matching — data.html may say "월 예상 비용",
  // "총 예상 비용", "총 누적 비용 (실측)" depending on actual vs estimate path.
  const monthly = items.find(i => /월/.test(i.label));
  const total   = items.find(i => /총\s*(누적|예상)/.test(i.label));
  if (!monthly && !total) { footer.hidden = true; return; }

  const isActual = /실측/.test(bucket.heading.textContent || '');
  const tagText = isActual ? '실측' : '추정';
  const parts = [];
  if (monthly) parts.push('<span class="amt">이번 달 <strong>' + escapeHtml(monthly.val) + '</strong></span>');
  if (total)   parts.push('<span class="amt">누적 <strong>' + escapeHtml(total.val) + '</strong></span>');
  const sep = ' <span class="sep">·</span> ';
  line.innerHTML = parts.join(sep) + sep +
    '<span class="tag' + (isActual ? ' actual' : '') + '">' + tagText + '</span>';
  footer.hidden = false;
}

// Tiny HTML-escape — values come from auto-generated data.html so they should
// be safe, but defense in depth never hurts and prevents accidental markup
// injection if a future pipeline change emits unsanitized text.
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function setStat(id, value) {
  const el = document.getElementById(id);
  if (el && value) el.textContent = Number(value).toLocaleString('en-US');
}

// innerHTML doesn't execute <script>. Re-inject so pagerStep/showTab become
// addressable via window.* — required for the inline onclick attributes
// inside data.html's tables and tab buttons.
function runInjectedScripts(host) {
  host.querySelectorAll('script').forEach(old => {
    const s = document.createElement('script');
    s.text = old.textContent;
    document.head.appendChild(s);
    old.remove();
  });
}

// Search · filter · sort
// (Preserved from SPEC-AGENT-SEARCH-001 and SPEC-AGENT-FILTER-001 —

window.__searchGetRows = function (root) {
  const r = root || document;
  const tbl = r.getElementById ? r.getElementById('tbl-apps') : r.querySelector('#tbl-apps');
  if (!tbl) return [];
  return Array.from(tbl.querySelectorAll('tbody tr'));
};

window.__searchMatchRow = function (tr, q) {
  if (!q) return true;
  const tds = tr.children;
  if (!tds || tds.length < 5) return false;
  const titleCell = tds[2];
  const titleAttr = (titleCell.getAttribute && titleCell.getAttribute('title')) || titleCell.textContent || '';
  const isNew = tds.length >= 7;
  const director = isNew ? (tds[3].textContent || '') : '';
  const company = isNew ? (tds[4].textContent || '') : '';
  const role = (isNew ? tds[5] : tds[3]).textContent || '';
  const email = (isNew ? tds[6] : tds[4]).textContent || '';
  const hay = (titleAttr + ' ' + director + ' ' + company + ' ' + role + ' ' + email).toLowerCase();
  return hay.indexOf(q) !== -1;
};

window.__getRowDate = function (tr) {
  const tds = tr.children;
  if (!tds || tds.length < 1) return null;
  const txt = (tds[0].textContent || '').trim();
  if (!txt) return null;
  const ms = Date.parse(txt);
  if (isNaN(ms)) return null;
  return new Date(ms);
};

window.__getRowStatus = function (tr) {
  const badge = tr.querySelector ? tr.querySelector('.badge') : null;
  if (!badge) return '';
  const cl = badge.classList;
  for (let i = 0; i < cl.length; i++) {
    if (cl[i] !== 'badge') return cl[i];
  }
  return '';
};

window.__matchStatus = function (cls, want) {
  if (want === 'all' || !want) return true;
  if (!cls) return false;
  if (want === 'sent') return cls === 'sent';
  if (want === 'failed') return cls.indexOf('failed') === 0 || cls === 'sent_dbfail';
  if (want === 'skipped') return cls.indexOf('skipped') === 0;
  return false;
};

window.__getPeriodWindow = function (now) {
  const n = now || new Date();
  const todayStart = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const tomorrow = new Date(todayStart); tomorrow.setDate(todayStart.getDate() + 1);
  const dow = todayStart.getDay();
  const monOffset = (dow === 0) ? -6 : (1 - dow);
  const weekStart = new Date(todayStart); weekStart.setDate(todayStart.getDate() + monOffset);
  const nextWeek = new Date(weekStart); nextWeek.setDate(weekStart.getDate() + 7);
  const monthStart = new Date(todayStart.getFullYear(), todayStart.getMonth(), 1);
  const nextMonth = new Date(todayStart.getFullYear(), todayStart.getMonth() + 1, 1);
  return { todayStart, tomorrow, weekStart, nextWeek, monthStart, nextMonth };
};

window.__inPeriod = function (date, period, win) {
  if (period === 'all' || !period) return true;
  if (!date) return false;
  const t = date.getTime();
  if (period === 'today') return t >= win.todayStart.getTime() && t < win.tomorrow.getTime();
  if (period === 'week')  return t >= win.weekStart.getTime() && t < win.nextWeek.getTime();
  if (period === 'month') return t >= win.monthStart.getTime() && t < win.nextMonth.getTime();
  return true;
};

window.__filterRow = function (tr, q, period, status, win) {
  if (!window.__searchMatchRow(tr, q)) return false;
  if (!window.__matchStatus(window.__getRowStatus(tr), status)) return false;
  if (!window.__inPeriod(window.__getRowDate(tr), period, win)) return false;
  return true;
};

window.applySearch = function () { return window.applyAllFilters(); };

window.applyAllFilters = function () {
  const input = document.getElementById('search-input');
  const empty = document.getElementById('search-empty');
  const periodSel = document.getElementById('filter-period');
  const statusSel = document.getElementById('filter-status');
  const sortSel = document.getElementById('filter-sort');
  if (!input) return;
  const q = (input.value || '').trim().toLowerCase();
  const period = periodSel ? periodSel.value : 'all';
  const status = statusSel ? statusSel.value : 'all';
  const sortKey = sortSel ? sortSel.value : 'recent';
  const win = window.__getPeriodWindow(new Date());
  const rows = window.__searchGetRows(document);
  const visible = [];
  rows.forEach(tr => {
    if (window.__filterRow(tr, q, period, status, win)) {
      tr.style.display = '';
      visible.push(tr);
    } else {
      tr.style.display = 'none';
    }
  });

  if (visible.length > 0) {
    const tbody = visible[0].parentNode;
    if (tbody) {
      visible.sort(function (a, b) {
        const aDate = (a.children[0] && a.children[0].textContent) || '';
        const bDate = (b.children[0] && b.children[0].textContent) || '';
        if (sortKey === 'oldest') return aDate.localeCompare(bDate);
        if (sortKey === 'title') {
          const aTitle = (a.children[2] && (a.children[2].getAttribute('title') || a.children[2].textContent)) || '';
          const bTitle = (b.children[2] && (b.children[2].getAttribute('title') || b.children[2].textContent)) || '';
          return aTitle.localeCompare(bTitle, 'ko');
        }
        return bDate.localeCompare(aDate);
      });
      visible.forEach(function (tr) { tbody.appendChild(tr); });
    }
  }

  const anyFilter = !!q || (period && period !== 'all') || (status && status !== 'all');
  if (empty) {
    if (anyFilter && rows.length > 0 && visible.length === 0) empty.classList.add('show');
    else empty.classList.remove('show');
  }

  // Result count line under the toolbar.
  const out = document.getElementById('result-line');
  if (out) {
    if (rows.length === 0) out.textContent = '';
    else if (visible.length === rows.length) out.innerHTML = '총 <strong>' + rows.length + '</strong>건';
    else out.innerHTML = '<strong>' + visible.length + '</strong> / ' + rows.length + '건 일치';
  }
};

// Wire toolbar controls
const _searchInput = document.getElementById('search-input');
const _filterPeriod = document.getElementById('filter-period');
const _filterStatus = document.getElementById('filter-status');
const _filterSort = document.getElementById('filter-sort');
const _filterReset = document.getElementById('filter-reset');
if (_searchInput) _searchInput.addEventListener('input', window.applyAllFilters);
if (_filterPeriod) _filterPeriod.addEventListener('change', window.applyAllFilters);
if (_filterStatus) _filterStatus.addEventListener('change', window.applyAllFilters);
if (_filterSort) _filterSort.addEventListener('change', window.applyAllFilters);
if (_filterReset) {
  _filterReset.addEventListener('click', function () {
    if (_searchInput) _searchInput.value = '';
    if (_filterPeriod) _filterPeriod.value = 'all';
    if (_filterStatus) _filterStatus.value = 'all';
    if (_filterSort) _filterSort.value = 'recent';
    window.applyAllFilters();
  });
}
